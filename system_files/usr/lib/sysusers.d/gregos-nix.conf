# Determinate Nix build users.
#
# The Nix daemon performs builds as unprivileged users in the nixbld group.
# The UIDs/GIDs match the Determinate Nix installer's Linux defaults (group
# 30000, users 30001-30032), which are also the ownership recorded in the
# image's baked /nix seed. systemd-sysusers creates them on boot; build.sh
# also runs sysusers at image build time so the ownership resolves in the
# final image.
g nixbld 30000
u nixbld1 30001:nixbld "Nix build user 1" /var/empty /sbin/nologin
u nixbld2 30002:nixbld "Nix build user 2" /var/empty /sbin/nologin
u nixbld3 30003:nixbld "Nix build user 3" /var/empty /sbin/nologin
