# gregOS: the "greeter" system account runs the Noctalia login greeter under
# greetd. The u entry creates it if it is missing; the m entries add it to the
# device-access groups it may need before login. systemd-sysusers applies this
# on boot; entries are idempotent and never modify an existing account.
u greeter - "Noctalia Greeter" /var/lib/greetd /usr/sbin/nologin
m greeter video
m greeter input
