# gregOS: the "greeter" system account runs the Noctalia login greeter under
# greetd. Its HOME is kept out of /var/lib/greetd (reserved for greetd's own
# daemon account) and is unused anyway - Noctalia Greeter stores its state under
# /var/lib/noctalia-greeter and its session wrapper provides XDG_RUNTIME_DIR.
#
# The m lines grant the device access the greeter's wlroots compositor needs to
# use the GPU (DRM) and input devices. systemd-sysusers applies these on first
# boot; gregos-noctalia-greeter-setup verifies and repairs the membership after
# a rebase onto an image where the account already existed.
u greeter - "Noctalia Greeter" /var/lib/gregos-greeter /usr/sbin/nologin
m greeter video
m greeter input
m greeter render
