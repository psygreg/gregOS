# gregOS: the "greeter" system account runs the Noctalia login greeter under
# greetd. Keep its HOME separate: the greetd package reserves /var/lib/greetd
# for its own daemon account. Supplementary device-group membership is applied
# by gregos-noctalia-greeter-setup because Bazzite stores base groups in /usr/lib/group.
u greeter - "Noctalia Greeter" /var/lib/gregos-greeter /usr/sbin/nologin
