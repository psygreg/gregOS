# gregOS: cap Mesa's on-disk compiled-shader cache at ~10 GB so large shader
# libraries (games, browsers) keep a bounded cache instead of thrashing it
# after GPU driver updates.
#
# Propagated through systemd's DefaultEnvironment, so every service inherits
# it — including greetd → the Noctalia greeter → the niri session → every app
# launched inside it. The K/M/G suffix matters: per Mesa docs
# (MESA_SHADER_CACHE_MAX_SIZE), a bare number without one is parsed as
# gigabytes.
DefaultEnvironment=MESA_SHADER_CACHE_MAX_SIZE=10G
