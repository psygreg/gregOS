# gregOS: raise Mesa's on-disk compiled-shader cache limit so large shader
# libraries (games, browsers) keep their cache instead of thrashing it after
# GPU driver updates.
#
# Propagated through systemd's DefaultEnvironment, so every service inherits
# it — including greetd → the Noctalia greeter → the niri session → every app
# launched inside it. Per Mesa docs (MESA_SHADER_CACHE_MAX_SIZE), a bare
# number without a K/M/G suffix is parsed as gigabytes.
DefaultEnvironment=MESA_SHADER_CACHE_MAX_SIZE=10000000000
