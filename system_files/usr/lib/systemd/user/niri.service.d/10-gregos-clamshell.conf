# Managed by gregOS - start the laptop lid policy with the niri session.
#
# A drop-in on niri.service rather than a spawn-at-startup entry: this way the
# service also runs for homes whose ~/.config/niri/config.kdl is a stale,
# user-modified copy of an older full config (the config seeder deliberately
# leaves those alone, so they would not see a new spawn-at-startup line).
#
# Order the daemon before the compositor so it comes up at the very start of
# the session and can take its logind handle-lid-switch inhibitor there. It
# retries niri IPC while the compositor starts.

[Unit]
Wants=gregos-clamshell.service
After=gregos-clamshell.service
