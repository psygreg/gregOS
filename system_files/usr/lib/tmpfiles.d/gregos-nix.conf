# Backing directory for the /nix bind mount. var-home-nix.service creates it
# very early (before nix.mount); this rule is a second, ordering-independent
# guarantee for systemd-tmpfiles and keeps the path documented in one place.
d /var/home/nix 0755 root root -

# Home directory of the nixbld build users from Fedora's nix-system package.
# It is root-owned on purpose: the build users only need it to exist, never to
# write there.
d /var/empty 0755 root root -
