# gregOS: snapd runtime state on an immutable (bootc/ostree) system.
#
# On a traditional distro, snapd's RPM %post scriptlet creates these
# directories at install time. In a bootc image build the scriptlets run in the
# build container and the resulting /var content is NOT carried onto deployed
# hosts (ostree preserves the *host's* /var across deployments; the image's /var
# is only consulted at first install). bootc container lint also warns about
# image /var content that has no tmpfiles.d counterpart ("var-tmpfiles").
#
# Declaring them here guarantees they exist with the right ownership on every
# boot of every deployment, matching the file list of Fedora's snapd RPM.
#
# snapd itself writes /var/lib/snapd/state.json, /var/lib/snapd/system-key,
# /var/lib/snapd/seccomp/bpf/global.bin and the contents of
# /var/lib/snapd/snap/bin at runtime - only the directories are created here.

d /var/cache/snapd 0755 root root -
d /var/lib/snapd 0755 root root -
d /var/lib/snapd/assertions 0755 root root -
d /var/lib/snapd/cgroup 0755 root root -
d /var/lib/snapd/cookie 0755 root root -
d /var/lib/snapd/dbus-1 0755 root root -
d /var/lib/snapd/dbus-1/services 0755 root root -
d /var/lib/snapd/dbus-1/system-services 0755 root root -
d /var/lib/snapd/desktop 0755 root root -
d /var/lib/snapd/desktop/applications 0755 root root -
d /var/lib/snapd/device 0755 root root -
d /var/lib/snapd/hostfs 0755 root root -
d /var/lib/snapd/inhibit 0755 root root -
d /var/lib/snapd/lib 0755 root root -
d /var/lib/snapd/lib/gl 0755 root root -
d /var/lib/snapd/lib/gl32 0755 root root -
d /var/lib/snapd/lib/glvnd 0755 root root -
d /var/lib/snapd/lib/vulkan 0755 root root -
d /var/lib/snapd/mount 0755 root root -
d /var/lib/snapd/seccomp 0755 root root -
d /var/lib/snapd/seccomp/bpf 0755 root root -
d /var/lib/snapd/snap 0755 root root -
d /var/lib/snapd/snap/bin 0755 root root -
d /var/lib/snapd/snaps 0755 root root -
d /var/snap 0755 root root -

# Cache files and snapd's own runtime state (state.json, system-key,
# seccomp/bpf/global.bin, snap/bin/*) are created by snapd at runtime; only the
# directories need to exist beforehand.
