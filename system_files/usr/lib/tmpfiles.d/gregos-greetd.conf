# greetd starts its default session from the greeter account's home directory.
# sysusers.d records /var/lib/greetd as that home but does not create it. On a
# bootc rebase, /var is preserved from the previous deployment, so the empty
# directory from the greetd RPM may not be present there.
d /var/lib/greetd 0750 greeter greeter -
