# /var is persistent across bootc deployments. The Fedora 44 Terra package
# does not ship Noctalia Greeter's optional tmpfiles rule, so create its
# documented state directory and the greeter account's separate HOME.
d /var/lib/noctalia-greeter 0750 greeter greeter -
d /var/lib/gregos-greeter 0750 greeter greeter -
