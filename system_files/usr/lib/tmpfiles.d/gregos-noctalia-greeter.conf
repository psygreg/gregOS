# /var is persistent across bootc deployments.
#
# /var/lib/noctalia-greeter is Noctalia Greeter's state directory. The upstream
# helper (noctalia-greeter-apply-appearance --setup-system) creates and owns it
# on first run; this rule guarantees the directory exists with the right
# ownership even before that, and is recreated on every boot.
#
# /var/lib/gregos-greeter is the greeter account's declared HOME (see
# gregos-niri.conf). It is created here so the account always has a valid,
# writable home; Noctalia Greeter itself does not use it for state.
d /var/lib/noctalia-greeter 0750 greeter greeter -
d /var/lib/gregos-greeter 0750 greeter greeter -
