# Nix applications use the host's Fedora CA bundle for TLS. Fedora's Nix
# profile scripts look for /etc/pki/tls/certs/ca-bundle.crt, which this image
# does not ship, so set the extracted bundle here for systemd user services and
# D-Bus-activated applications. /etc/environment covers PAM login sessions.
NIX_SSL_CERT_FILE=/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem

# Non-free packages are allowed by default. This variable is honoured by
# impure evaluation (legacy nix-env/nix-build and `nix ... --impure`); flake
# commands such as `nix profile install nixpkgs#...` need --impure for it to
# take effect, while the shipped Home Manager flake sets allowUnfree itself.
NIXPKGS_ALLOW_UNFREE=1
