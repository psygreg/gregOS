# gregOS: ibus input-method environment for the systemd user manager
#
# The ibus environment (GTK_IM_MODULE, QT_IM_MODULE, XMODIFIERS) has to reach
# every toolkit through every way an app can start:
#
#   - Apps spawned by the niri session: dotfiles/niri/config.kdl sets them in
#     niri's `environment` block, so every child of the compositor inherits
#     them (the Noctalia launcher, terminals, ...).
#
#   - Flatpaks: system_files/etc/flatpak/overrides/global injects them into
#     every sandbox (Flatpaks never see the host session environment).
#
#   - Apps spawned by the systemd user manager: THIS FILE. When an app's
#     desktop file sets DBusActivatable=true, launching it through
#     org.freedesktop.Application (e.g. "Open with..." in a file manager)
#     does not fork/exec the app as a child of the caller - the app is
#     spawned as a --gapplication-service child of the systemd user manager,
#     with THAT manager's environment instead of the caller's.
#     niri-session runs `systemctl --user import-environment` before niri
#     even exists, so the manager's environment never contains variables
#     that only exist inside the niri session. These conf files are read by
#     systemd's environment.d generator when the user manager starts, so
#     such apps get them regardless of how they were launched.
#
#     Without a toolkit ibus module, GTK 4.20+ delegates dead-key/compose
#     handling to the text-input path (see the rationale in
#     dotfiles/niri/config.kdl), so D-Bus-activated apps could not read dead
#     keys while the same apps launched from the session could.
#
# Redundancy is deliberate and harmless: session-spawned apps get the
# variables twice with identical values, and a user's own
# ~/.config/environment.d/*.conf still wins over this file (same-name and
# later-sorted files override /usr/lib).
#
# If ibus is ever removed from the image, delete this file together with the
# `environment` block in dotfiles/niri/config.kdl and the Flatpak override in
# system_files/etc/flatpak/overrides/global, or toolkits will try to talk to
# a daemon that is not there (they fall back to their default input
# handling with a warning in the log).
GTK_IM_MODULE=ibus
QT_IM_MODULE=ibus
XMODIFIERS=@im=ibus
