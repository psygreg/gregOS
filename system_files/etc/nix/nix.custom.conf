# gregOS additions to the Determinate Nix configuration.
#
# Determinate Nix generates and replaces /etc/nix/nix.conf itself, so this is
# the only supported place for local settings. The generated nix.conf includes
# this file with "!include nix.custom.conf".
#
# Wheel members are trusted daemon users: they may pass daemon options and
# manage the shared store, which is the expected behaviour for the image's
# admin account. Normal users can still use the daemon and their own profiles.
trusted-users = root @wheel

# Fedora/Bazzite ship the CA bundle here; Nix's own default path
# (/etc/ssl/certs/ca-certificates.crt) exists but this is the canonical
# extracted bundle on the image.
ssl-cert-file = /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
