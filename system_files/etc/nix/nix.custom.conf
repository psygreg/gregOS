# gregOS additions to Fedora's Nix configuration.
#
# Fedora's nix-core package owns /etc/nix/nix.conf; build.sh adds a single
# "include nix.custom.conf" line so these settings survive package updates.
#
# Wheel members are trusted daemon users: they may pass daemon options,
# manage the shared store and add further binary caches.
trusted-users = root @wheel

# Hard-link identical files between store paths as builds finish. This keeps
# the store compact when many packages ship the same libraries; old
# generations then cost little beyond their profile symlink.
auto-optimise-store = true

# The nix-community Cachix cache carries Home Manager and other community
# builds that are not on cache.nixos.org. The public key below is the cache's
# signing key, verified against https://nix-community.cachix.org.
extra-substituters = https://nix-community.cachix.org
extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
