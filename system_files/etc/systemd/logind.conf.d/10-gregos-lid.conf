# Managed by gregOS - fallback lid switch policy.
#
# Inside a niri session the gregos-clamshell user service takes a logind
# handle-lid-switch block inhibitor and implements the image's real policy:
# hibernate (or suspend) when the lid closes on battery, and clamshell mode
# when it closes on AC with an external display connected. This drop-in pins
# what logind does when that service is not running: the Noctalia greeter, a
# TTY, a non-niri session, or a session where the user stopped the service.
#
# Every lid close suspends. The two per-context defaults would otherwise be
# wrong here:
#   HandleLidSwitchExternalPower   is ignored by logind unless set explicitly
#                                  (backwards compatibility), so only
#                                  HandleLidSwitch applies;
#   HandleLidSwitchDocked          defaults to ignore, so a laptop with an
#                                  external display attached would stay awake
#                                  on battery with the lid shut.
#
# LidSwitchIgnoreInhibited=yes keeps logind's default: high-level sleep
# inhibitors (the kind applications take to postpone sleep) do not stop a lid
# close. The low-level handle-lid-switch inhibitor is a different mechanism
# and is what gives gregos-clamshell control inside the session.
#
# Users who want a different fallback can override any of these keys with a
# later-numbered drop-in (files are applied in lexicographic order and the
# last value wins).

[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=suspend
LidSwitchIgnoreInhibited=yes
