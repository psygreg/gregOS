# Managed by gregOS - the physical power button goes through niri-resume.
#
# niri normally takes over the power key for the session: it takes a logind
# "handle-power-key" block inhibitor at startup and acts on the key itself,
# suspending the machine (its hardcoded default, see
# niri's find_bind: KEY_XF86PowerOff => Action::Suspend). The shipped niri
# config (dotfiles/niri/config.kdl) instead sets disable-power-key-handling
# and binds XF86PowerOff to "niri-resume save-shutdown", so the session
# snapshot is written before the machine powers off. That only works if
# logind stays out of the way for short presses: with this option commented,
# logind would run its own HandlePowerKey action (poweroff by default) on
# every press, with no chance for niri-resume to save anything.
#
# Outside a niri session (the Noctalia greeter, a TTY console) nothing binds
# the power key, so with ignore a short press would do nothing at all.
# HandlePowerKeyLongPress keeps the familiar fallback: holding the button
# still powers the machine off through logind. In a niri session the short-
# press bind already initiated shutdown at press time, so the long-press
# timeout is never reached in practice.
#
# Users who prefer different behavior can override either key with a
# later-numbered drop-in (drop-ins are applied in lexicographic order and
# the last one wins) or by re-binding XF86PowerOff in their niri config.

[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
